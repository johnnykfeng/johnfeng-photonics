[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/johnfeng_photonics"]

[project]
name = "johnfeng-photonics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg==0.6.0",
    "matplotlib==3.10.7",
    "numpy==2.3.3",
    "pandas==2.3.3",
    "pillow==11.3.0",
    "plotly==6.3.1",
    "pydantic==2.10.6",
    "ruff>=0.15.20",
    "streamlit==1.50.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
